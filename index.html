<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="wrapper">
        <aside>
            <header>
                <h1 class="logo">Streetwear Shop</h1>
            </header>
            <nav>
                <ul class="menu">
                    <li>
                        <button class="boton-menu boton-categoria"><i class="bi bi-hand-index-thumb-fill"></i> Todos los productos</button>
                    </li>
                    <li>
                        <button class="boton-menu boton-categoria"><i class="bi bi-hand-index-thumb"></i> Camisetas</button>
                    </li>
                    <li>
                        <button class="boton-menu boton-categoria"><i class="bi bi-hand-index-thumb"></i> Zapatos</button>
                    </li>
                    <li>
                        <button class="boton-menu boton-categoria"><i class="bi bi-hand-index-thumb"></i> Hoodies</button>
                    </li>
                    <li>
                        <a class="boton-menu boton-carrito active" href="./carrito.html"><i class="bi bi-cart-fill"></i> Carrito <span class="numerito"> 0</span>
                    </a>
                </li>
                </ul>
            </nav>
            <footer>
                <p class="text-footer">©2025 SPC</p>
            </footer>

        </aside>
    
        <main>
            <h2 class="titulo-principal">Todos los productos</h2>
            <div class="contenedor-productos">
                <div class="producto-imagen">
                    <img src="./camisetas/chrome hearts" alt="">
                <div class="producto-detalles">
                    <h3 class="producto-titulo">Camiseta Chrome Hearts</h3>
                    <p class="producto-precio">$450</p>
                    <button class="producto-agregar">Agregar</button>
                    </div>
                </div>
                <div class="producto-imagen">
                    <img src="./camisetas/corteiz" alt="">
                <div class="producto-detalles">
                    <h3 class="producto-titulo">Camiseta Corteiz</h3>
                    <p class="producto-precio">$400</p>
                    <button class="producto-agregar">Agregar</button>

                    </div>
                </div>
                <div class="producto-imagen">
                    <img src="./camisetas/denim tears" alt="">
                <div class="producto-detalles">
                    <h3 class="producto-titulo">Camiseta Denim Tears</h3>
                    <p class="producto-precio">$500</p>
                    <button class="producto-agregar">Agregar</button>
                    </div>
                </div>
                <div class="producto-imagen">
                    <img src="./camisetas/offwhite" alt="">
                <div class="producto-detalles">
                    <h3 class="producto-titulo">Camiseta Off-white</h3>
                    <p class="producto-precio">$380</p>
                    <button class="producto-agregar">Agregar</button>
                    </div>
                </div>
                <div class="producto-imagen">
                    <img src="./camisetas/stussy" alt="">
                <div class="producto-detalles">
                    <h3 class="producto-titulo">Camiseta Stussy</h3>
                    <p class="producto-precio">$150</p>
                    <button class="producto-agregar">Agregar</button>
                    </div>
                </div>
    </main>
    
    </div>





    <script src="./script.js"></script>
</body>
</html>
