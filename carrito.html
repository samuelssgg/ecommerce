<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <aside>
            <header>
                <h1 class="logo">Off-white Shop</h1>
            </header>
            <nav>
                <ul>
                    <li>
                        <a class="boton-menu boton-volver" href="./index.html"><i class="bi bi-arrow-return-left"></i> Seguir comprando
                    </a>
                </li>
                 
                    <li>
                        <a class="boton-menu boton-carrito active" href="./carrito.html"><i class="bi bi-cart-fill"></i> Carrito <span class="numerito"> 0</span>
                    </a>
                </li>
                </ul>
            </nav>
            <footer>
                <p class="text-footer">©2025 SPC</p>
            </footer>

        </aside>
    
        <main>
                <h2 class="titulo-principal">Carrito</h2>
            <div class="contenedor-carrito">
            <p class="carrito vacio">Tu carrito esta vacio.<i class="bi bi-emoji-frown"></i></p>
            <div class="carrito-productos">

                <div class="carrito producto">
                    <img src="./camisetas/chrome hearts" alt="">
                    <div class="carrito-producto-titulo">
                        <small>Nombre</small>
                        <h3>Camiseta Chrome Hearts</h3>
                        <div class="carrito-producto-cantidad">
                            <small>Cantidad</small>
                            <p>1</p>
                        </div>
                        <div class="carrito-producto-precio">
                            <small>Precio</small>
                            <p>$450</p>
                        </div>
                        <div class="carrito-producto-subtotal">
                            <small>Subtotal</small>
                            <p>$450</p>
                            <button class="carrito producto-eliminar"><i class="bi bi-trash3-fill"></i></button>                     
                        </div>
                    </div>
                </div>

                <div class="carrito producto">
                    <img src="./camisetas/corteiz" alt="">
                    <div class="carrito-producto-titulo">
                        <small>Nombre</small>
                        <h3>Camiseta Corteiz</h3>
                    </div>
                        <div class="carrito-producto-cantidad">
                            <small>Cantidad</small>
                            <p>1</p>
                        </div>
                        <div class="carrito-producto-precio">
                            <small>Precio</small>
                            <p>$400</p>
                        </div>
                        <div class="carrito-producto-subtotal">
                            <small>Subtotal</small>
                            <p>$850</p>
                            <button class="carrito producto-eliminar"><i class="bi bi-trash3-fill"></i></button>                     
                        </div>
               
                </div>
            
            </div>

            <div class="carrito acciones">
                <div class="carrito-acciones-izquierda">
                    <button class="carrito-acciones-vaciar">Vaciar carrito</button>
                </div>
                <div class="carrito-acciones-derecha">
                    <div class="carrito-acciones-total">
                        <p>Total</p>
                        <p id="total">$850</p>
                    </div>
                    <button class="carrito-acciones-comprar">Comprar ahora</button>
                </div>

            </div>
            
        
        </div>

    </main>
    
    </div>

    <script src="./script.js"></script>
</body>
</html>
